<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>代理錢包｜作品集展示</title>
  <meta name="description" content="代理錢包後台互動原型展示；頁面資料均為示意資料。">
  <link rel="stylesheet" href="./account-wallet.css">
  <link rel="stylesheet" href="./agent-wallet.css">
</head>
<body>
<main class="page-shell">
  <header class="page-header">
    <div><div class="title-row"><h1>代理錢包</h1><span>列表</span></div></div>
    <nav><a href="./index.html">⌂ 主頁</a><b>/</b><span>Wallets</span></nav>
  </header>

  <section class="toolbar">
    <div class="actions">
      <button class="outline" id="refreshBtn" type="button">↻ 刷新</button>
      <button class="outline" id="overviewBtn" type="button">代理總覽</button>
      <button class="outline" id="transferBtn" type="button">系統上下分</button>
    </div>
    <button class="outline export" id="exportBtn" type="button">⇩ 導出</button>
  </section>

  <section class="agent-search-panel" aria-label="代理錢包查詢條件">
    <div class="searches">
      <label><span>⌕</span><input id="nameFilter" placeholder="輸入代理名稱查詢"></label>
      <label><span>⌕</span><input id="idFilter" inputmode="numeric" placeholder="輸入代理 ID 查詢"></label>
      <label><span>⌕</span><input id="codeFilter" placeholder="輸入商號查詢"></label>
    </div>
  </section>

  <section class="table-card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>上級代理</th><th data-sort="id">代理 ID <i>↕</i></th><th>代理商號</th><th>代理名稱</th><th>幣種</th><th data-sort="balance" class="numeric">餘額 <i>↕</i></th><th data-sort="created">創建時間 <i>↕</i></th><th data-sort="updated">更新時間 <i>↕</i></th><th>操作</th></tr></thead>
        <tbody id="walletRows"></tbody>
      </table>
      <div class="empty hidden" id="emptyState"><strong>查無資料</strong><span>請調整查詢條件後再試一次</span></div>
    </div>
    <footer class="pagination"><span id="rangeText">顯示 0–0，共 0 筆</span><div><button id="prevPage">‹</button><span id="pageButtons"></span><button id="nextPage">›</button><select id="pageSize"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option><option>200</option></select><em>筆 / 頁</em></div></footer>
  </section>
</main>

<div class="modal-layer hidden" id="overviewModal"><section class="modal wide"><header><div><h2>代理總覽</h2><span>代理層級與即時錢包餘額</span></div><button data-close="overviewModal">×</button></header><div class="zoom-tools"><button id="zoomOut">−</button><b id="zoomValue">100%</b><button id="zoomIn">＋</button><button id="zoomReset">重設</button></div><div class="tree-viewport"><div class="agent-tree" id="agentTree"></div></div><footer><button class="primary" data-close="overviewModal">完成</button></footer></section></div>

<div class="modal-layer hidden" id="transferModal"><section class="modal"><header><div><h2>系統上下分</h2><span>正數為上分，負數為下分</span></div><button data-close="transferModal">×</button></header><form id="transferForm" novalidate><div class="form-grid">
  <label class="full"><span>代理名稱 <i>*</i></span><div class="tag-input" id="agentTagInput"><div id="selectedTags"></div><input id="agentInput" autocomplete="off" placeholder="輸入代理名稱，可用逗號分隔"></div><div class="suggestions hidden" id="agentSuggestions"></div><small class="error" id="agentError"></small></label>
  <label><span>幣種</span><input value="JPY" disabled></label><label><span>合作方式</span><input value="信用" disabled></label>
  <label class="full"><span>額度 <i>*</i></span><input id="amountInput" inputmode="numeric" placeholder="例如 10,000 或 -5,000"><small>輸入正數增加餘額；輸入負數扣減餘額</small><small class="error" id="amountError"></small></label>
  <label class="full"><span>備註 <i>*</i></span><textarea id="remarkInput" maxlength="200" placeholder="請輸入本次操作原因"></textarea><small class="counter"><b id="remarkCount">0</b> / 200</small><small class="error" id="remarkError"></small></label>
  </div><footer><button class="ghost" id="resetTransfer" type="button">重置</button><button class="primary" type="submit">提交</button></footer></form></section></div>

<div class="modal-layer hidden" id="confirmModal"><section class="modal confirm"><header><div><h2>確認高額交易</h2><span>此操作需要再次確認</span></div><button data-close="confirmModal">×</button></header><div class="confirm-body"><b>!</b><p id="confirmText"></p></div><footer><button class="ghost" data-close="confirmModal">取消</button><button class="danger" id="confirmTransfer">確認提交</button></footer></section></div>
<div class="toast hidden" id="toast"></div>
<script src="./agent-wallet.js"></script>
</body>
</html>
