<dialog class="cvdlg" id="cvdlg" aria-label="履歷">
  <div class="cvh">
    <div class="cvtabs" role="tablist">
      <button type="button" role="tab" class="on" data-cv="sa" aria-selected="true">系統分析版</button>
      <button type="button" role="tab" data-cv="pm" aria-selected="false">專案管理版</button>
    </div>
    <a class="cvdl" id="cvdl" href="https://crimsonhsu-pm.github.io/portfolio/resume/xu-danhe-resume-sa.pdf" target="_blank" rel="noopener">下載 PDF ↗</a>
    <button class="dclose" type="button" id="cvclose" aria-label="關閉">×</button>
  </div>
  <div class="cvpages" id="cvsa"><img src="img/cv/sa-1.webp" alt="系統分析版履歷第 1 頁" width="909" height="1287" loading="lazy"><img src="img/cv/sa-2.webp" alt="系統分析版履歷第 2 頁" width="909" height="1287" loading="lazy"><img src="img/cv/sa-3.webp" alt="系統分析版履歷第 3 頁" width="909" height="1287" loading="lazy"><img src="img/cv/sa-4.webp" alt="系統分析版履歷第 4 頁" width="909" height="1287" loading="lazy"><img src="img/cv/sa-5.webp" alt="系統分析版履歷第 5 頁" width="909" height="1287" loading="lazy"><img src="img/cv/sa-6.webp" alt="系統分析版履歷第 6 頁" width="909" height="1287" loading="lazy"></div>
  <div class="cvpages" id="cvpm" hidden><img src="img/cv/pm-1.webp" alt="專案管理版履歷第 1 頁" width="909" height="1287" loading="lazy"><img src="img/cv/pm-2.webp" alt="專案管理版履歷第 2 頁" width="909" height="1287" loading="lazy"><img src="img/cv/pm-3.webp" alt="專案管理版履歷第 3 頁" width="909" height="1287" loading="lazy"><img src="img/cv/pm-4.webp" alt="專案管理版履歷第 4 頁" width="909" height="1287" loading="lazy"><img src="img/cv/pm-5.webp" alt="專案管理版履歷第 5 頁" width="909" height="1287" loading="lazy"><img src="img/cv/pm-6.webp" alt="專案管理版履歷第 6 頁" width="909" height="1287" loading="lazy"></div>
</dialog>
<script>(function(){var d=document.getElementById('cvdlg');if(!d)return;var dl=document.getElementById('cvdl');
function show(k){[].forEach.call(d.querySelectorAll('.cvtabs button'),function(b){var on=b.getAttribute('data-cv')===k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});document.getElementById('cvsa').hidden=k!=='sa';document.getElementById('cvpm').hidden=k!=='pm';dl.href='https://crimsonhsu-pm.github.io/portfolio/resume/xu-danhe-resume-'+k+'.pdf';d.querySelector('.cvpages:not([hidden])').scrollTop=0;}
[].forEach.call(d.querySelectorAll('.cvtabs button'),function(b){b.addEventListener('click',function(){show(b.getAttribute('data-cv'))})});
[].forEach.call(document.querySelectorAll('.opencv'),function(o){o.addEventListener('click',function(e){e.stopPropagation();show(o.getAttribute('data-cv')||'sa');try{d.showModal()}catch(err){d.setAttribute('open','')}})});
document.getElementById('cvclose').addEventListener('click',function(){d.close()});d.addEventListener('click',function(e){if(e.target===d)d.close()});})();</script>
