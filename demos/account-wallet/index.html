<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>帳戶錢包｜原版互動原型</title>
  <meta name="description" content="帳戶錢包管理介面原版互動原型。展示查詢、篩選、錢包操作與流水限額調整，使用虛構範例資料。">
  <link rel="stylesheet" href="./account-wallet.css">
</head>
<body>
<main class="page-shell">
  <header class="page-header">
    <div><div class="title-row"><h1>帳戶錢包</h1><span>展示版・範例資料</span></div></div>
    <nav><span>⌂ 主頁</span><b>/</b><span>Wallets</span></nav>
  </header>

  <section class="toolbar">
    <div class="actions"><button class="outline" id="refreshBtn" type="button">↻ 刷新</button><button class="outline active" id="filterToggleBtn" type="button">篩選</button><button class="outline" id="agentOverviewBtn" type="button">代理總覽</button><button class="outline" id="walletActionBtn" type="button">系統上下分</button><button class="outline" id="turnoverActionBtn" type="button">流水限額調整</button></div>
    <button class="outline export" id="exportWalletBtn" type="button">⇩ 導出</button>
  </section>

  <section class="filter-stack">
    <div class="filter-row agent-filter"><span>代理</span><button class="active" type="button">全部</button><button type="button">Administrator</button><button type="button">網咖 OTP</button><button type="button">網咖免驗證</button></div>
    <div class="filter-row standard-filter"><span>標籤</span><button class="active" type="button">全部</button><button type="button">警示</button><button type="button">封禁</button><button type="button">金牌</button><button type="button">渠道</button><button type="button">測試</button></div>
    <div class="filter-row standard-filter"><span>幣種</span><button class="active" type="button">全部</button><button type="button">JPY</button><button type="button">USD</button><button type="button">CNY</button></div>
    <div class="filter-row standard-filter position-filter"><span>倉位</span><button class="active" type="button">全部</button><button type="button">現金</button><button type="button">補點</button></div>
    <label class="serial-search"><span>⌕</span><input id="userFilter" maxlength="8" inputmode="numeric" placeholder="輸入用戶序號查詢"><button id="clearSearch" type="button">×</button></label>
  </section>

  <section class="table-card">
    <div class="table-wrap"><table><thead><tr><th class="check"><input type="checkbox" aria-label="全選"></th><th>ID</th><th>錢包序號</th><th>用戶序號</th><th>代理</th><th>標籤</th><th>幣種</th><th class="position-col">倉位</th><th class="numeric">餘額</th><th>創建時間</th><th>更新時間</th><th class="operation">操作</th></tr></thead><tbody id="walletRows"></tbody></table><div class="empty hidden" id="emptyState"><strong>查無資料</strong><span>請確認用戶序號是否正確</span></div></div>
    <footer><span id="rangeText">顯示 0–0，共 0 筆</span><div><button id="prevPage">‹</button><b id="pageNumber">1</b><button id="nextPage">›</button><select id="pageSize"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select><em>筆 / 頁</em></div></footer>
  </section>
</main>

<div class="modal-layer hidden" id="walletModal"><section class="modal"><header><div><h2>系統上下分</h2></div><button data-close="walletModal">×</button></header><div class="transfer-tabs" role="tablist"><button class="active" type="button" data-mode="otp">網咖 OTP</button><button type="button" data-mode="noverify">網咖免驗證</button></div><form id="walletForm" novalidate><div class="form-body">
  <label class="full"><span>用戶序號 <i>*</i></span><div class="lookup"><input id="walletUserId" maxlength="8" inputmode="numeric" placeholder="請輸入 8 碼用戶序號"><button id="lookupUser" type="button">查詢</button></div><small class="error" id="userError"></small></label>
  <label class="otp-only"><span>流水限額</span><input id="currentTurnover" value="—" disabled></label><label><span>餘額</span><input id="currentBalance" value="—" disabled></label>
  <label><span>幣種</span><input value="JPY" disabled></label><label><span>倉位</span><select id="positionSelect"><option value="現金">現金</option><option value="補點">補點</option><option value="消點">消點</option></select></label>
  <div class="full otp-only amount-presets"><span>固定額度 <i>*</i></span><div><button type="button" data-amount="10000"><b>10,000</b><small>實際上分 10,000</small></button><button type="button" data-amount="55000"><b>50,000 + 5,000</b><small>實際上分 55,000</small></button><button type="button" data-amount="120000"><b>100,000 + 20,000</b><small>實際上分 120,000</small></button><button class="withdraw-all" type="button" id="withdrawAll"><b>全額下分</b><small>帶入可提餘額</small></button></div></div>
  <label class="full"><span>額度 <i>*</i></span><input id="walletAmount" inputmode="numeric" placeholder="請輸入額度"><small class="error" id="amountError"></small></label>
  <label class="full otp-only check-row"><input id="accumulateTurnover" type="checkbox" checked><span>流水限額累加</span><small>上分時依實際額度累加流水</small></label>
  <label class="full check-row"><input id="calcCoding" type="checkbox"><span>計算打碼量</span><small>保留欄位，本期不參與計算</small></label>
  <label class="full"><span>備註 <i>*</i></span><textarea id="walletRemark" maxlength="200" placeholder="請輸入操作原因"></textarea><small class="error" id="remarkError"></small></label>
  </div><footer><button class="ghost" id="resetWalletBtn" type="button">重置</button><button class="primary" type="submit">提交</button></footer></form></section></div>

<div class="modal-layer hidden" id="turnoverModal"><section class="modal small"><header><div><h2>流水限額調整</h2><span>僅適用網咖 OTP</span></div><button data-close="turnoverModal">×</button></header><form id="turnoverForm" novalidate><div class="form-body one-col"><label><span>用戶序號 <i>*</i></span><div class="lookup"><input id="turnoverUserId" maxlength="8" inputmode="numeric" placeholder="請輸入 8 碼用戶序號"><button id="lookupTurnover" type="button">查詢</button></div><small class="error" id="turnoverUserError"></small></label><label><span>目前流水限額</span><input id="turnoverCurrent" value="—" disabled></label><label><span>調整額度 <i>*</i></span><input id="turnoverAmount" inputmode="numeric" placeholder="正數增加，負數扣減"><small class="error" id="turnoverAmountError"></small></label><label><span>備註 <i>*</i></span><textarea id="turnoverRemark" maxlength="200" placeholder="請輸入調整原因"></textarea><small class="error" id="turnoverRemarkError"></small></label></div><footer><button class="ghost" type="button" data-close="turnoverModal">取消</button><button class="primary" type="submit">提交</button></footer></form></section></div>

<div class="modal-layer hidden" id="riskModal"><section class="modal small"><header><div><h2>下分風險確認</h2><span id="riskStep">確認 1 / 3</span></div><button data-close="riskModal">×</button></header><div class="risk-body"><b>!</b><p id="riskText"></p></div><footer><button class="ghost" data-close="riskModal">取消</button><button class="danger" id="riskConfirm">確定</button></footer></section></div>
<div class="toast hidden" id="toast"></div>
<script src="./account-wallet.js"></script>
</body>
</html>
